<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
:root{--ink:#0F172A;--ink2:#334155;--mu:#64748B;--line:#E2E8F0;--glass:#F8FAFC;--ghost:#F1F5F9;--card:#fff;--c1:#22D3EE;--c2:#4F46E5;--blue:#2563EB;--p1:#1E3A8A;--p2:#2563EB;--p3:#4F46E5;--pd:#1D4ED8;--pe:#4F46E5;--soft:#EEF2FF;--soft2:#E0F2FE;--softb:#A5B4FC;--softt:#4338CA;--glow:rgba(37,99,235,.7);--glow2:rgba(30,58,138,.45);--ring:rgba(99,102,241,.16);--pg1:#D6E2FF;--pg2:#E8EEFF;--pg3:#F5F7FD;--bl1:#93B4FF;--bl2:#C4B5FD;--lgc1:#172554;--lgc2:#312E81}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:max(18px,env(safe-area-inset-top)) 14px max(36px,env(safe-area-inset-bottom));background:linear-gradient(180deg,var(--pg1) 0,var(--pg2) 280px,var(--pg3) 100%);color:var(--ink);font-family:var(--ff,Inter),Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.45}.bg i:nth-child(1){width:380px;height:380px;background:var(--bl1);top:-140px;right:-100px}.bg i:nth-child(2){width:320px;height:320px;background:var(--bl2);bottom:-120px;left:-100px;opacity:.35}.bg i:nth-child(3){display:none}
.wrap{position:relative;z-index:1;width:100%;max-width:440px}
.card{position:relative;border-radius:30px;background:var(--card);overflow:hidden;box-shadow:0 2px 4px rgba(15,23,42,.04),0 30px 70px -24px var(--glow2);animation:up .7s cubic-bezier(.22,1,.36,1) both}
.hd{--ink:#fff;--mu:#C7D7FE;--line:rgba(255,255,255,.22);--glass:rgba(255,255,255,.12);position:relative;color:#fff;padding:20px 20px 40px;background:linear-gradient(135deg,var(--p1) 0%,var(--p2) 52%,var(--pe) 100%);overflow:hidden;transition:background .6s}
.hd:before{content:"";position:absolute;width:300px;height:300px;right:-90px;top:-130px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%)}
.hd:after{content:"";position:absolute;left:-60px;bottom:-110px;width:240px;height:240px;border-radius:50%;border:34px solid rgba(255,255,255,.06)}
.hd>*{position:relative;z-index:1}.hd.ok{background:linear-gradient(135deg,#047857 0%,#10B981 60%,#34D399 100%)}.hd.bad{background:linear-gradient(135deg,#991B1B 0%,#EF4444 100%)}
.bd{position:relative;z-index:2;margin-top:-22px;background:var(--card);border-radius:26px 26px 0 0;padding:22px 20px 22px;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;letter-spacing:.2px}.brand img{width:42px;height:42px;object-fit:contain;padding:4px;border-radius:14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:#BBF7D0;background:rgba(34,197,94,.18);border:1px solid rgba(134,239,172,.4);padding:5px 10px;border-radius:99px}
.stepper{display:flex;align-items:center;margin:2px 4px 18px}.stepper .s{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:10px;font-weight:600;color:var(--mu);flex:0 0 auto;min-width:54px}
.stepper .d{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--glass);border:1px solid var(--line);transition:.4s}
.stepper .s.on .d{background:#fff;border-color:transparent;color:var(--p2);box-shadow:0 0 0 5px rgba(255,255,255,.22)}.stepper .s.on{color:#fff}.stepper .s.done .d{background:#22C55E;border-color:transparent;color:#fff}.stepper .s.done{color:#BBF7D0}
.stepper .l{flex:1;height:2px;background:var(--line);margin:-16px -2px 0;border-radius:2px;overflow:hidden}.stepper .l b{display:block;height:100%;width:0;background:#fff;transition:width .6s}.stepper .l.f b{width:100%}
.m{display:flex;align-items:center;gap:12px;margin-bottom:4px}.av{width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:21px;flex-shrink:0;text-transform:uppercase;backdrop-filter:blur(6px)}
.m .t{font-weight:700;font-size:16px;line-height:1.25;text-align:left;word-break:break-word}.m .v{font-size:11.5px;color:#BAE6FD;display:flex;align-items:center;gap:5px;margin-top:2px;text-align:left}
.amt{font-family:var(--ffn,'Space Grotesk'),Inter,sans-serif;font-size:48px;font-weight:700;letter-spacing:-2px;line-height:1.1;margin:14px 0 2px;color:#fff;text-align:center;text-shadow:0 6px 24px rgba(0,0,0,.25)}.amt small{font-size:26px;opacity:.75;margin-right:2px}.cap{text-align:center;color:var(--mu);font-size:12px}
.desc{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:13.5px;color:var(--ink2);margin:0 0 14px;text-align:left;line-height:1.5}
.muted{color:var(--mu);font-size:12.5px}.h{font-weight:800;font-size:21px;margin-bottom:4px}
.fld{position:relative;margin-bottom:10px}.fld i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:16px}
input.f{width:100%;background:var(--glass);border:1.5px solid var(--line);border-radius:16px;padding:14px 14px 14px 42px;font-size:15px;color:var(--ink);outline:0;font-family:inherit;transition:.25s}
input.f::placeholder{color:#94A3B8}input.f:focus{border-color:var(--p3);background:var(--card);box-shadow:0 0 0 5px var(--ring)}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;border:0;border-radius:18px;padding:16px;font-weight:700;font-size:16px;color:#fff;background:linear-gradient(120deg,var(--pd),var(--p2),var(--pe),var(--pd));background-size:300% 100%;animation:grad 6s ease infinite;box-shadow:0 16px 30px -12px var(--glow);cursor:pointer;position:relative;overflow:hidden;text-decoration:none;touch-action:manipulation;transition:transform .15s,filter .2s;font-family:inherit}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}.btn:disabled{opacity:.85;cursor:wait}.btn:after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.4),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite}
.btn.ghost{background:var(--ghost);border:1px solid var(--line);color:var(--ink);box-shadow:none;animation:none;font-size:14px;padding:13px}.btn.ghost:after{display:none}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 14px}.apps a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:11px 4px;border-radius:16px;background:var(--glass);border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:11px;font-weight:600;transition:.2s}.apps a:active{transform:scale(.94)}.apps a:hover{background:var(--soft);border-color:var(--softb)}
.apps b{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.qrbox{position:relative;display:inline-block;padding:14px;border-radius:26px;background:#fff;border:1px solid var(--line);box-shadow:0 20px 44px -18px var(--glow)}
.qrbox img.q{display:block;width:204px;height:204px;border-radius:10px}.qrbox .lg{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);background:#fff;border-radius:14px;padding:5px;box-shadow:0 4px 14px rgba(0,0,0,.2)}.qrbox .lg img{width:100%;height:100%;object-fit:contain;display:block}
.qrbox:before,.qrbox:after{content:"";position:absolute;width:30px;height:30px;border:4px solid var(--p2);border-radius:11px;animation:pulse 2s ease-in-out infinite}.qrbox:before{top:-6px;left:-6px;border-right:0;border-bottom:0}.qrbox:after{bottom:-6px;right:-6px;border-left:0;border-top:0}
.scan{position:absolute;left:14px;right:14px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--p2),var(--p3),transparent);box-shadow:0 0 14px var(--p2);animation:scan 2.6s ease-in-out infinite;top:16px;z-index:2}
.upi{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 6px;padding:10px 10px 10px 16px;border-radius:16px;background:var(--soft);border:1px dashed var(--softb);color:var(--ink);font-weight:700;font-size:14px;word-break:break-all;text-align:left}
.copy{border:0;border-radius:12px;background:var(--soft2);color:var(--softt);width:40px;height:40px;flex-shrink:0;font-size:16px;transition:.2s}.copy.ok{background:#DCFCE7;color:#15803D}
.lbl{font-size:12.5px;color:var(--mu);margin:16px 0 10px}
.cells{position:relative;display:flex;justify-content:center;gap:10px;margin-bottom:6px;width:100%}.grp{display:flex;gap:4px;flex:1;min-width:0}.cell{flex:1;min-width:0;max-width:28px;height:40px;border-radius:9px;background:var(--glass);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--ffn,'Space Grotesk'),monospace;font-weight:700;font-size:18px;color:var(--ink);transition:.15s}
.cell.on{border-color:var(--p3);background:var(--soft);box-shadow:0 0 0 3px var(--ring)}.cell.on:empty:after{content:"";width:2px;height:18px;background:var(--p3);animation:blink 1s steps(1) infinite}.cell.fill{border-color:#4ADE80;background:rgba(34,197,94,.14);animation:pop2 .2s}
.cells.bad{animation:shake .45s}.cells.bad .cell{border-color:#F87171}
.hid{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;background:transparent;color:transparent;caret-color:transparent}
.bar{height:4px;border-radius:4px;background:var(--line);margin:10px 4px 10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--p3),var(--p2));transition:width .25s}
.err{color:#DC2626;font-size:12.5px;min-height:18px;margin-bottom:8px}
.foot{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:16px;font-size:11px;color:#94A3B8}.foot span{display:flex;align-items:center;gap:5px}
.orbit{position:relative;width:132px;height:132px;margin:2px auto 20px}.orbit .r{position:absolute;inset:0;border-radius:50%;border:2px dashed var(--softb);animation:spin2 9s linear infinite}.orbit .r2{inset:16px;border-color:var(--p3);animation-direction:reverse;animation-duration:6s}
.orbit .r:before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--p2);box-shadow:0 0 14px var(--p2)}.orbit .c{position:absolute;inset:34px;border-radius:50%;background:linear-gradient(135deg,var(--soft),var(--soft2));box-shadow:0 8px 24px -8px var(--glow);display:flex;align-items:center;justify-content:center;animation:pulse2 2s ease-in-out infinite}.orbit .c img{width:46px;height:46px;object-fit:contain}
.chk{text-align:left;margin:16px 0 4px;display:flex;flex-direction:column;gap:10px}.chk div{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--mu)}.chk .i{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--line);font-size:13px;flex-shrink:0}
.chk .ok{color:var(--ink);font-weight:600}.chk .ok .i{background:#22C55E;border-color:transparent;color:#fff}.chk .go{color:var(--ink);font-weight:600}.chk .go .i{border-color:var(--softb)}.chk .go .i:after{content:"";width:12px;height:12px;border:2px solid var(--softb);border-top-color:var(--p3);border-radius:50%;animation:sp .8s linear infinite}
.tick{width:96px;height:96px;margin:2px auto 12px;display:block;filter:drop-shadow(0 12px 24px rgba(34,197,94,.4))}.tick circle{stroke:#22C55E;stroke-width:5;fill:rgba(34,197,94,.12);stroke-dasharray:302;stroke-dashoffset:302;animation:draw .7s .1s ease forwards}.tick path{stroke:#16A34A;stroke-width:7;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .7s ease forwards}
.tick.x circle{stroke:#F87171;fill:rgba(248,113,113,.12)}.tick.x path{stroke:#DC2626}
.rcpt{margin:18px 0 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line);padding:6px 16px;text-align:left}.rcpt div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:13px;border-bottom:1px dashed var(--line)}.rcpt div:last-child{border:0}.rcpt span{color:var(--mu)}.rcpt b{font-weight:600;word-break:break-all;text-align:right}
.cf{position:fixed;top:-14px;width:9px;height:14px;border-radius:2px;z-index:99;animation:fall linear forwards;pointer-events:none}
.spin{width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
.fade{animation:fadeUp .55s cubic-bezier(.22,1,.36,1) both}.fade:nth-child(2){animation-delay:.05s}.fade:nth-child(3){animation-delay:.1s}.fade:nth-child(4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes spin2{to{transform:rotate(360deg)}}@keyframes sp{to{transform:rotate(360deg)}}@keyframes grad{50%{background-position:100% 0}}@keyframes shine{0%,55%{left:-60%}100%{left:140%}}@keyframes pulse{50%{opacity:.35}}@keyframes pulse2{50%{transform:scale(1.08)}}
@keyframes scan{0%,100%{top:16px;opacity:0}12%,88%{opacity:1}50%{top:210px}}@keyframes blink{50%{opacity:0}}@keyframes pop2{50%{transform:scale(1.12)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

/* ---- animation modes (chosen in index.html > Customize Page) ---- */
html[data-anim=off] *,html[data-anim=off] *:before,html[data-anim=off] *:after{animation:none!important;transition:none!important}
html[data-anim=off] .tick circle,html[data-anim=off] .tick path{stroke-dashoffset:0!important}
html[data-anim=off] .scan,html[data-anim=off] .btn:after{display:none}
html[data-anim=off] .spin{animation:sp .7s linear infinite!important}
html[data-anim=off] .chk .go .i:after{animation:sp .8s linear infinite!important}
@keyframes hdflow{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes drift1{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,60px)}}
@keyframes drift2{0%,100%{transform:translate(0,0)}50%{transform:translate(80px,-50px)}}
@keyframes bubUp{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:.75}100%{transform:translateY(-115vh) scale(1.15);opacity:0}}
@keyframes glowb{0%,100%{box-shadow:0 2px 4px rgba(15,23,42,.04),0 30px 70px -24px var(--glow2),0 0 0 0 var(--ring)}50%{box-shadow:0 2px 4px rgba(15,23,42,.04),0 30px 80px -18px var(--glow),0 0 0 9px var(--ring)}}
@keyframes glowt{50%{text-shadow:0 0 30px rgba(255,255,255,.7),0 6px 24px rgba(0,0,0,.25)}}
html[data-anim=aurora] .hd:not(.ok):not(.bad){background-size:260% 260%;animation:hdflow 9s ease infinite}
html[data-anim=aurora] .bg i:nth-child(1){animation:drift1 12s ease-in-out infinite}
html[data-anim=aurora] .bg i:nth-child(2){animation:drift2 14s ease-in-out infinite}
html[data-anim=aurora] .bg i:nth-child(3){display:block;width:300px;height:300px;background:var(--p3);top:38%;left:28%;opacity:.22;animation:drift1 17s ease-in-out infinite reverse}
.bg .bub{position:absolute;bottom:-70px;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),var(--bl1));opacity:0;animation:bubUp linear infinite}
html[data-anim=glow] .card{animation:up .7s cubic-bezier(.22,1,.36,1) both,glowb 3s ease-in-out .8s infinite}
html[data-anim=glow] .amt{animation:glowt 3s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
.pst{display:flex;align-items:center;justify-content:center;gap:6px;margin:-4px auto 12px;font-size:12.5px;font-weight:600;color:var(--softt);background:var(--soft);border:0;border-radius:99px;padding:7px 14px;cursor:pointer}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.lgc{width:52px;height:52px;border-radius:17px;background:linear-gradient(145deg,var(--lgc1),var(--lgc2));display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.4);box-shadow:0 8px 22px -6px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25)}.lgc svg{width:40px;height:40px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}.orbit .c svg{width:56px;height:56px}
.brand{gap:11px;font-size:16px}
</style>

<style id="qp-checkout-premium-edge">

@media(max-width:520px){body{padding-left:10px!important;padding-right:10px!important}.wrap{max-width:440px!important}.card{border-radius:24px!important}}
